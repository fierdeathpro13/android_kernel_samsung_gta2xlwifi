name: Build Kernel 2.2GHz

on:
  push:
  workflow_dispatch:

jobs:
  kernel-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Git installieren (Container hat es nicht eingebaut)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y git

      - name: Code holen
        uses: actions/checkout@v4

      - name: System vorbereiten
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y bc build-essential libncurses5-dev libssl-dev \
            xz-utils wget curl git bison flex rsync lz4 liblz4-tool cpio \
            clang lld llvm \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Kernel bauen
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # Konfiguration laden
          make ARCH=arm64 gta2xlwifi_defconfig

          # Kompilieren: Clang fuer C-Code, GNU-Binutils fuer den Rest
          make -j$(nproc) ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SM-T590-2.2GHz
          path: arch/arm64/boot/Image.gz-dtb
