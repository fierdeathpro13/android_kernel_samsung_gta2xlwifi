name: Build Kernel SM-T590 (2.2GHz)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev xz-utils wget curl git bison flex rsync lz4 liblz4-tool cpio

      - name: Clone Proton-Clang (Community Toolchain)
        run: |
          # Wir klonen den stabilsten Android-Compiler direkt von GitHub, um Googles Sperre zu umgehen
          git clone https://github.com --depth=1 $GITHUB_WORKSPACE/toolchain

      - name: Compile Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make ARCH=arm64 gta2xlwifi_defconfig
          make ARCH=arm64 CC=clang -j$(nproc)

      - name: Upload compiled boot.img
        uses: actions/upload-artifact@v4
        with:
          name: 2.2GHz-Kernel-SM-T590
          path: arch/arm64/boot/Image.gz-dtb
