name: Build Kernel 2.2GHz

on:
  push:
  workflow_dispatch:

jobs:
  kernel-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Git installieren (Container hat es nicht eingebaut)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y git

      - name: Code holen
        uses: actions/checkout@v4

      - name: Build-Abhaengigkeiten installieren
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y bc build-essential libncurses5-dev libssl-dev \
            xz-utils wget curl bison flex rsync lz4 liblz4-tool cpio python3

      # Exakt die Clang-Version, die build.config.common vorschreibt (clang-r365631c),
      # statt Ubuntus generischem "apt install clang".
      - name: Original-Clang (r365631c) laden
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r365631c.tar.gz -O clang.tar.gz
          tar -C $GITHUB_WORKSPACE/toolchain/clang -xzf clang.tar.gz
          
      # Passende AOSP-GCC-Prebuilts fuer die Binutils (as/ld/ar usw.), die Clang
      # zusammen mit CROSS_COMPILE braucht.
      - name: AOSP-GCC-Binutils laden (arm64 + arm32)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain/gcc64 $GITHUB_WORKSPACE/toolchain/gcc32
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz -O gcc64.tar.gz
          tar -C $GITHUB_WORKSPACE/toolchain/gcc64 -xzf gcc64.tar.gz
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz -O gcc32.tar.gz
          tar -C $GITHUB_WORKSPACE/toolchain/gcc32 -xzf gcc32.tar.gz

      - name: Kernel konfigurieren und kompilieren
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make ARCH=arm64 gta2xlwifi_defconfig
          make -j"$(nproc)" ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SM-T590-2.2GHz
          path: arch/arm64/boot/Image.gz-dtb
