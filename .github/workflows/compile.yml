name: Build Kernel 2.2GHz

on:
  push:
  workflow_dispatch:

jobs:
  kernel-build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Linux Tools laden
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev xz-utils wget curl git bison flex rsync lz4 liblz4-tool cpio

      - name: AOSP Clang Compiler holen
        run: |
          mkdir -p $GITHUB_WORKSPACE/tc
          cd $GITHUB_WORKSPACE/tc
          # Wir nutzen die stabile Android-Clang-Version (r450784d) für Kernel 4.9
          wget https://googlesource.com
          tar -xf clang-r450784d.tar.gz

      - name: Kernel bauen
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/tc/bin:$PATH
          
          # Konfiguration laden
          make ARCH=arm64 gta2xlwifi_defconfig
          
          # Bauvorgang mit Clang starten (Standard für Kernel 4.9)
          make -j$(nproc) ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu-

      - name: Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SM-T590-2.2GHz
          path: arch/arm64/boot/Image.gz-dtb
