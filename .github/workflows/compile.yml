name: Build Kernel 2.2GHz

on:
  push:
  workflow_dispatch:

jobs:
  kernel-build:
    runs-on: ubuntu-latest
    container:
      # Hier nutzen wir die offizielle, fertige Entwicklungsumgebung der Android-Community
      image: docker://ubuntu:20.04
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: System vorbereiten
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y bc build-essential libncurses5-dev libssl-dev xz-utils wget curl git bison flex rsync lz4 liblz4-tool cpio clang lld llvm

      - name: Kernel bauen
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Konfiguration laden
          make ARCH=arm64 gta2xlwifi_defconfig
          
          # Direktes Kompilieren mit den integrierten LLVM/Clang Tools
          make -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SM-T590-2.2GHz
          path: arch/arm64/boot/Image.gz-dtb
